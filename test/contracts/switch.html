<!-- td-toggle (.td-switch) markup contract — same block the 135 kit / dwp emit server-side. -->
<template data-component="td-toggle" data-markup='<td-toggle label="Wifi" size="lg"></td-toggle>'>
  <label class="td-switch td-switch--lg">
    <input type="checkbox" role="switch" class="td-switch__input">
    <span class="td-switch__track" aria-hidden="true"><span class="td-switch__thumb">
      <span class="td-switch__icon td-switch__icon--off" data-td-icon="close"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="close"></svg></span>
      <span class="td-switch__icon td-switch__icon--on" data-td-icon="check"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="check"></svg></span>
    </span></span>
    <span class="td-switch__label">Wifi</span>
  </label>
</template>
