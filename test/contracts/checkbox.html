<!-- td-checkbox markup contract (SSR: emit this inside <td-checkbox> or standalone with td.css). -->
<template data-component="td-checkbox" data-markup='<td-checkbox label="Đồng ý" size="sm"></td-checkbox>'>
  <label class="td-checkbox td-checkbox--sm">
    <input type="checkbox" class="td-checkbox__input">
    <span class="td-checkbox__mark" aria-hidden="true"><span class="td-checkbox__icon" data-td-icon="check"><svg aria-hidden="true" class="td-icon td-icon--m td-checkbox__svg" data-icon="check"></svg></span></span>
    <span class="td-checkbox__label">Đồng ý</span>
  </label>
</template>
