<!-- TdToast contract: the container with ONE toast per template (TdToast._showSingle(message, data-type,
     data-duration) after two frames → data-state="open"). The container id is load-bearing. Every toast (sticky =
     duration 0 too) carries the named close button. Checked by src/feedback/td-batch3-toast.browser-test.js. -->
<template data-component="td-toast" data-type="info" data-duration="4000">
  <div id="td-toast-container" class="td-toasts">
    <div class="td-toast td-toast--info td-glass-surface td-glass-surface--strong" role="status" aria-live="polite" data-state="open">
      <span class="td-toast__icon" aria-hidden="true"><svg class="td-icon td-icon--m" data-icon="info" aria-hidden="true"></svg></span>
      <span class="td-toast__message">Nội dung</span>
      <button type="button" class="td-toast__close" aria-label="Đóng"><svg class="td-icon td-icon--s" data-icon="close" aria-hidden="true"></svg></button>
    </div>
  </div>
</template>
<template data-component="td-toast" data-type="success" data-duration="4000">
  <div id="td-toast-container" class="td-toasts">
    <div class="td-toast td-toast--success td-glass-surface td-glass-surface--strong" role="status" aria-live="polite" data-state="open">
      <span class="td-toast__icon" aria-hidden="true"><svg class="td-icon td-icon--m" data-icon="success" aria-hidden="true"></svg></span>
      <span class="td-toast__message">Nội dung</span>

    </div>
  </div>
</template>

</template>
<template data-component="td-toast" data-type="error" data-duration="5000">

      <span class="td-toast__icon" aria-hidden="true"><svg class="td-icon td-icon--m" data-icon="error" aria-hidden="true"></svg></span>

  <div id="td-toast-container" class="td-toasts">

      <span class="td-toast__icon" aria-hidden="true"><svg class="td-icon td-icon--m" data-icon="info" aria-hidden="true"></svg></span>

    </div>
  </div>
</template>
