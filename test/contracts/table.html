<!-- td-table markup contract (v0.10.0; v0.34.0: explicit roles table/rowgroup/row/columnheader/cell, data-card roles,
     th--sortable, aria-hidden card label in every body cell). `data-setup` is a JS function body run with `el` = the
     mounted host (columns and data are JS properties). Explicit host id → deterministic title id {host-id}-title.
     Compared structurally (tag, sorted classes, KEEP attributes, text of leaf elements) by
     src/display/td-batch4-table.browser-test.js; nested td-pagination / td-empty-state / sort-icon children are not
     compared (own contracts; the sort glyph depends on the registry). Templates: data + sortable (title, 2 pages) ·
     empty · loading (no title → fallback name) · v0.37.0 selection (selectable multiple, 2 rows, 1 selected → header
     mixed; the tick icon slot is not compared). -->
<template data-component="td-table"
          data-markup='<td-table id="tbl-c" title="Người dùng" per-page="2"></td-table>'
          data-setup='el.columns = [{ key: "name", label: "Tên", sortable: true }, { key: "role", label: "Vai trò" }]; el.data = [{ name: "An", role: "Admin" }, { name: "Bình", role: "Editor" }, { name: "Chi", role: "Viewer" }];'>
  <div class="td-table td-table--zebra" data-state="ready">
    <div class="td-table__header">
      <h3 class="td-table__title" id="tbl-c-title">Người dùng</h3>
      <div class="td-table__pagination"><td-pagination quiet aria-label="Phân trang (trên)"></td-pagination></div>
    </div>
    <div class="td-table__scroll">
      <table class="td-table__table" role="table" aria-labelledby="tbl-c-title">
        <thead class="td-table__head" role="rowgroup"><tr role="row">
          <th class="td-table__th td-table__th--sortable" role="columnheader" scope="col" data-col="0" data-col-key="name" data-card="primary"><button type="button" class="td-table__sort" data-sort-col="0"><span class="td-table__sort-label">Tên</span><span class="td-table__sort-icon" aria-hidden="true" data-sort-icon="sort"></span></button></th>
          <th class="td-table__th" role="columnheader" scope="col" data-col="1" data-col-key="role" data-card="secondary">Vai trò</th>
        </tr></thead>
        <tbody class="td-table__body" role="rowgroup">
          <tr class="td-table__row" role="row" data-row-idx="0"><td class="td-table__cell" role="cell" data-col="0" data-col-key="name" data-card="primary"><span class="td-table__cell-label" aria-hidden="true">Tên</span>An</td><td class="td-table__cell" role="cell" data-col="1" data-col-key="role" data-card="secondary"><span class="td-table__cell-label" aria-hidden="true">Vai trò</span>Admin</td></tr>
          <tr class="td-table__row" role="row" data-row-idx="1"><td class="td-table__cell" role="cell" data-col="0" data-col-key="name" data-card="primary"><span class="td-table__cell-label" aria-hidden="true">Tên</span>Bình</td><td class="td-table__cell" role="cell" data-col="1" data-col-key="role" data-card="secondary"><span class="td-table__cell-label" aria-hidden="true">Vai trò</span>Editor</td></tr>
        </tbody>
      </table>
    </div>
    <div class="td-table__footer"><div class="td-table__pagination td-table__pagination--bottom"><td-pagination aria-label="Phân trang (dưới)"></td-pagination></div></div>
    <p class="td-sr-only" role="status"></p>
  </div>
</template>
