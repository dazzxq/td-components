<!-- td-table markup contract (v0.10.0). `data-setup` is a JS function body run with `el` = the mounted host (columns and
     data are JS properties). Explicit host id → deterministic title id {host-id}-title. Compared structurally (tag,
     sorted classes, KEEP attributes) by src/display/td-batch4-table.browser-test.js; nested td-pagination /
     td-empty-state / sort-icon children are not compared (own contracts; the sort glyph depends on the registry). Templates: data + sortable (title, 2 pages) · empty · loading (no title → fallback name). -->
<template data-component="td-table"
          data-markup='<td-table id="tbl-c" title="Người dùng" per-page="2"></td-table>'
          data-setup='el.columns = [{ key: "name", label: "Tên", sortable: true }, { key: "role", label: "Vai trò" }]; el.data = [{ name: "An", role: "Admin" }, { name: "Bình", role: "Editor" }, { name: "Chi", role: "Viewer" }];'>
  <div class="td-table td-table--zebra" data-state="ready">
    <div class="td-table__header">
      <h3 class="td-table__title" id="tbl-c-title">Người dùng</h3>
      <div class="td-table__pagination"><td-pagination quiet aria-label="Phân trang (trên)"></td-pagination></div>
    </div>
    <div class="td-table__scroll">
      <table class="td-table__table" aria-labelledby="tbl-c-title">
        <thead class="td-table__head"><tr>
          <th class="td-table__th" scope="col" data-col="0" data-col-key="name"><button type="button" class="td-table__sort" data-sort-col="0"><span class="td-table__sort-label">Tên</span><span class="td-table__sort-icon" aria-hidden="true" data-sort-icon="sort"></span></button></th>
          <th class="td-table__th" scope="col" data-col="1" data-col-key="role">Vai trò</th>
        </tr></thead>
        <tbody class="td-table__body">
          <tr class="td-table__row" data-row-idx="0"><td class="td-table__cell" data-col="0" data-col-key="name">An</td><td class="td-table__cell" data-col="1" data-col-key="role">Admin</td></tr>
          <tr class="td-table__row" data-row-idx="1"><td class="td-table__cell" data-col="0" data-col-key="name">Bình</td><td class="td-table__cell" data-col="1" data-col-key="role">Editor</td></tr>
        </tbody>
      </table>
    </div>
    <div class="td-table__footer"><div class="td-table__pagination td-table__pagination--bottom"><td-pagination aria-label="Phân trang (dưới)"></td-pagination></div></div>
    <p class="td-sr-only" role="status"></p>
  </div>
</template>
<template data-component="td-table"
          data-markup='<td-table id="tbl-e" title="Đơn hàng" heading-level="2"></td-table>'
          data-setup='el.columns = [{ key: "id", label: "Mã" }, { key: "total", label: "Tổng" }]; el.data = [];'>
  <div class="td-table td-table--zebra" data-state="empty">
    <div class="td-table__header">
      <h2 class="td-table__title" id="tbl-e-title">Đơn hàng</h2>
      <div class="td-table__pagination" hidden><td-pagination quiet aria-label="Phân trang (trên)"></td-pagination></div>
    </div>
    <div class="td-table__scroll">
      <table class="td-table__table" aria-labelledby="tbl-e-title">
        <thead class="td-table__head"><tr>
          <th class="td-table__th" scope="col" data-col="0" data-col-key="id">Mã</th>
          <th class="td-table__th" scope="col" data-col="1" data-col-key="total">Tổng</th>
        </tr></thead>
        <tbody class="td-table__body">
          <tr class="td-table__empty-row"><td class="td-table__empty" colspan="2"><td-empty-state compact size="sm" heading-level="3" title="Không có dữ liệu" message="Chưa có dữ liệu để hiển thị."></td-empty-state></td></tr>
        </tbody>
      </table>
    </div>
    <div class="td-table__footer" hidden><div class="td-table__pagination td-table__pagination--bottom"><td-pagination aria-label="Phân trang (dưới)"></td-pagination></div></div>
    <p class="td-sr-only" role="status"></p>
  </div>
</template>
<template data-component="td-table"
          data-markup='<td-table id="tbl-l" loading loading-rows="2"></td-table>'
          data-setup='el.columns = [{ key: "a", label: "A" }, { key: "b", label: "B" }];'>
  <div class="td-table td-table--zebra" data-state="loading">
    <div class="td-table__header" hidden>
      <div class="td-table__pagination" hidden><td-pagination quiet aria-label="Phân trang (trên)"></td-pagination></div>
    </div>
    <div class="td-table__scroll">
      <table class="td-table__table" aria-label="Bảng dữ liệu" aria-busy="true">
        <thead class="td-table__head"><tr>
          <th class="td-table__th" scope="col" data-col="0" data-col-key="a">A</th>
          <th class="td-table__th" scope="col" data-col="1" data-col-key="b">B</th>
        </tr></thead>
        <tbody class="td-table__body">
          <tr class="td-table__row td-table__row--skeleton" aria-hidden="true"><td class="td-table__cell" data-col="0"><span class="td-table__skeleton"></span></td><td class="td-table__cell" data-col="1"><span class="td-table__skeleton"></span></td></tr>
          <tr class="td-table__row td-table__row--skeleton" aria-hidden="true"><td class="td-table__cell" data-col="0"><span class="td-table__skeleton"></span></td><td class="td-table__cell" data-col="1"><span class="td-table__skeleton"></span></td></tr>
        </tbody>
      </table>
    </div>
    <div class="td-table__footer" hidden><div class="td-table__pagination td-table__pagination--bottom"><td-pagination aria-label="Phân trang (dưới)"></td-pagination></div></div>
    <p class="td-sr-only" role="status">Đang tải dữ liệu…</p>
  </div>
</template>
