<!-- TdMenu markup contract (src/feedback/td-menu.js). `data-setup` is a JS function body run with `el` = the mounted
     markup's root and `TdMenu` in scope. Trigger templates compare `el.firstElementChild`; the `data-portal` template
     compares the open body-portaled `.td-menu`. `{m}` stands for the generated menu id (td-menu-{n}). SSR adapters
     emit the `.td-menu-btn` trigger (td.css styles it); the menu itself is always created by JS on open.
     Checked by src/feedback/td-v012-menu.browser-test.js. -->
<template data-component="td-menu-btn"
          data-markup='<div></div>'
          data-setup='const b = TdMenu.button({ items: [{ label: "Sửa" }] }); b.id = "mb-icon"; el.append(b);'>
  <button type="button" class="td-menu-btn" id="mb-icon" aria-haspopup="menu" aria-expanded="false" aria-label="Tùy chọn"><span class="td-menu-btn__icon" data-td-icon="more" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="more"></svg></span></button>
</template>
<template data-component="td-menu-btn"
          data-markup='<div></div>'
          data-setup='const b = TdMenu.button({ label: "Thêm", items: [{ label: "Sửa" }] }); b.id = "mb-label"; el.append(b);'>
  <button type="button" class="td-menu-btn" id="mb-label" aria-haspopup="menu" aria-expanded="false"><span class="td-menu-btn__icon" data-td-icon="more" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="more"></svg></span><span class="td-menu-btn__label">Thêm</span></button>
</template>
<template data-component="td-menu" data-portal
          data-markup='<button type="button" class="td-menu-btn" id="mt" aria-haspopup="menu" aria-expanded="false" aria-label="Tùy chọn"></button>'
          data-setup='const warn = console.warn; console.warn = () => {}; try { TdMenu.open(el, [
            { label: "Chia sẻ", icon: "link", hint: "Sao chép liên kết", id: "share" },
            { label: "Xoá", danger: true },
            { label: "Tải bản gốc", disabled: true, hint: "Chỉ dành cho thành viên" },
            { separator: true },
            { label: "Chế độ tối", type: "checkbox", checked: true },
            { label: "Mới nhất", group: "sort", checked: false },
            { label: "Mở trang", href: "https://example.com/", newTab: true },
            { label: "Liên kết xấu", href: "javascript:alert(1)" }
          ]); } finally { console.warn = warn; }'>
  <div class="td-menu td-glass-surface td-glass-surface--strong" id="{m}" role="menu" aria-labelledby="mt" data-state="open" data-placement="bottom" data-align="end">
    <button type="button" class="td-menu__item" role="menuitem" tabindex="-1" aria-labelledby="{m}-label-0" aria-describedby="{m}-hint-0" data-item="share"><span class="td-menu__label" id="{m}-label-0">Chia sẻ</span><span class="td-menu__icon" data-td-icon="link" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="link"></svg></span><span class="td-menu__hint" id="{m}-hint-0">Sao chép liên kết</span></button>
    <button type="button" class="td-menu__item td-menu__item--danger" role="menuitem" tabindex="-1"><span class="td-menu__label">Xoá</span></button>
    <button type="button" class="td-menu__item" role="menuitem" tabindex="-1" aria-disabled="true" aria-labelledby="{m}-label-2" aria-describedby="{m}-hint-2"><span class="td-menu__label" id="{m}-label-2">Tải bản gốc</span><span class="td-menu__hint" id="{m}-hint-2">Chỉ dành cho thành viên</span></button>
    <div class="td-menu__separator" role="separator"></div>
    <button type="button" class="td-menu__item" role="menuitemcheckbox" tabindex="-1" aria-checked="true"><span class="td-menu__label">Chế độ tối</span><span class="td-menu__check" data-td-icon="check" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="check"></svg></span></button>
    <button type="button" class="td-menu__item" role="menuitemradio" tabindex="-1" aria-checked="false"><span class="td-menu__label">Mới nhất</span><span class="td-menu__check" data-td-icon="check" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="check"></svg></span></button>
    <a class="td-menu__item" role="menuitem" tabindex="-1" href="https://example.com/" target="_blank" rel="noopener noreferrer"><span class="td-menu__label">Mở trang</span></a>
    <button type="button" class="td-menu__item" role="menuitem" tabindex="-1" aria-disabled="true"><span class="td-menu__label">Liên kết xấu</span></button>
  </div>
</template>
