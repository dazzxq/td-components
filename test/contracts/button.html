<!-- td-button markup contract. SSR adapters may emit the inner <button> directly (td.css styles it);
     <td-button> renders exactly this. Checked by src/form/td-contracts.browser-test.js. -->
<template data-component="td-button" data-markup='<td-button variant="primary" icon="download">Tải</td-button>'>
  <button class="td-btn td-btn--primary td-btn--md" type="button">
    <span class="td-btn__icon" data-td-icon="download" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--s" data-icon="download"></svg></span>
    <span class="td-btn__label">Tải</span>
    <span class="td-btn__spinner td-spinner td-spinner--sm" aria-hidden="true" hidden><svg aria-hidden="true" class="td-spinner__svg"><circle class="td-spinner__track"></circle><circle class="td-spinner__arc"></circle></svg></span>
  </button>
</template>
