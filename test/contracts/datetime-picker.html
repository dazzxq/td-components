<!-- td-datetime-picker markup contract (plan v0.10.0-batch4 item 1, inventory §7.1). Explicit host ids →
     deterministic {host}-trigger / {host}-dtp-* ids. Templates 1–3 = the host tree (el.firstElementChild).
     v0.60.0: the old template 4 (the dialog body with three number fields) is gone — the calendar dialog is covered by
     test/engines/calendar-a11y.spec.mjs (ariaSnapshot of the dialog). Checked by src/form/td-batch4-datetime-picker.browser-test.js. -->
<template data-component="td-datetime-picker"
          data-markup='<td-datetime-picker id="dtp-c" label="Hẹn giờ" required value="15/06/2026 - 10:30"></td-datetime-picker>'>
  <div class="td-dtp" data-state="closed">
    <label class="td-field__label" id="dtp-c-label" for="dtp-c-trigger">Hẹn giờ<span class="td-field__required" aria-hidden="true"> *</span></label>
    <button type="button" class="td-dtp__trigger" id="dtp-c-trigger" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-required="true"><span class="td-dtp__value">15/06/2026 - 10:30</span><span class="td-dtp__icon" data-td-icon="calendar" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="calendar"></svg></span></button>
  </div>
</template>
<template data-component="td-datetime-picker"
          data-markup='<td-datetime-picker id="dtp-p" aria-label="Thời điểm"></td-datetime-picker>'>
  <div class="td-dtp" data-state="closed">
    <button type="button" class="td-dtp__trigger" id="dtp-p-trigger" role="combobox" aria-haspopup="dialog" aria-expanded="false" aria-label="Thời điểm"><span class="td-dtp__value" data-placeholder>dd/mm/yyyy - hh:mm</span><span class="td-dtp__icon" data-td-icon="calendar" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="calendar"></svg></span></button>
  </div>
</template>
<template data-component="td-datetime-picker"
          data-markup='<td-datetime-picker id="dtp-e" label="Hạn" error-text="Bắt buộc" disabled></td-datetime-picker>'>
  <div class="td-dtp" data-state="closed">
    <label class="td-field__label" id="dtp-e-label" for="dtp-e-trigger">Hạn</label>
    <button type="button" class="td-dtp__trigger" id="dtp-e-trigger" role="combobox" aria-haspopup="dialog" aria-expanded="false" disabled aria-invalid="true" aria-errormessage="dtp-e-error" aria-describedby="dtp-e-error"><span class="td-dtp__value" data-placeholder>dd/mm/yyyy - hh:mm</span><span class="td-dtp__icon" data-td-icon="calendar" aria-hidden="true"><svg aria-hidden="true" class="td-icon td-icon--m" data-icon="calendar"></svg></span></button>
  </div>
</template>
