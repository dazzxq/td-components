# v0.33.0: (re)capture the visual baselines of test/visual/media-picker.visual.mjs on the reference platform — the
# official Playwright image pinned to package.json's playwright-core (same image as the `visual` job of test.yml) — never
# on macOS. Locally: `docker run --rm -it --ipc=host mcr.microsoft.com/playwright:v<playwright-core>-jammy`, copy the
# tree in (no host node_modules), `npm ci && npm run test:visual -- --update`. Run by hand (Actions → "update visual
# baselines" → Run workflow), download the `visual-baselines` artifact, unpack it into
# test/visual/baseline/linux-chromium/, review the images and commit them.
name: update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:visual -- --update
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: test/visual/baseline/linux-chromium/*.png
          if-no-files-found: error
