# CI for td-components (v0.13.0). NOT verified on GitHub yet: the repo is never pushed during the overnight run —
# run it on the first push and adjust if a step differs from the local setup.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers pinned by playwright-core (Chromium for the browser suites; Firefox + WebKit for the token gate
      # and the menu Tab engine check).
      - run: npx playwright-core install --with-deps chromium firefox webkit
      # The Tailwind CSP fixture (test/csp/fixture/tailwind.css) is committed, so the legacy+td profile needs no build.
      - run: npm test
