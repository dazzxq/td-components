# CI for td-components (added v0.13.0, first green on GitHub at v0.16.0). Linux runner: the CSP parity gate skips
# text-metric geometry there (baselines are captured on macOS — see test/csp/csp.spec.mjs BASELINE_PLATFORM).
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browsers pinned by playwright-core (Chromium for the browser suites; Firefox + WebKit for the token gate
      # and the menu Tab engine check).
      - run: npx playwright-core install --with-deps chromium firefox webkit
      # The Tailwind CSP fixture (test/csp/fixture/tailwind.css) is committed, so the legacy+td profile needs no build.
      # v0.41.0: `npm test` minus the two theme contrast gates, which run in parallel in the `theme` job below
      # (together they exceeded this job's 30-minute limit).
      - run: npm run test:ci
      # v0.34.0: screenshots of the responsive gate (8 acceptance widths) — for humans, never compared.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: responsive-screenshots
          path: test/responsive/__out__/
          if-no-files-found: ignore


  # v0.41.0: the theme contrast gates (token contrast + full-page theme gate: 3 engines × 4 palettes × 2 widths × 8
  # states) — split out of `test` so neither job nears its time limit. `npm test` locally still runs everything.
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium firefox webkit
      - run: npm run test:contrast-gates

  # v0.33.0: pixel gate for td-media-picker / justified td-media-grid (Chromium; not part of `npm test`). Runs inside the
  # official Playwright image pinned to package.json's playwright-core (fonts + Chromium build = the baselines'
  # reference platform; bump the tag together with playwright-core). TD_VISUAL_STRICT=1: a skip (wrong platform /
  # Chromium build) fails instead of passing silently; a missing baseline always fails. Baselines: workflow
  # update-visual-baselines.yml (same image). Actual PNGs of failing shots are uploaded below.
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:visual
        env:
          TD_VISUAL_STRICT: '1'
          TD_VISUAL_OUT: ${{ runner.temp }}/td-visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-actual
          path: ${{ runner.temp }}/td-visual
          if-no-files-found: ignore

  # v0.18.0 F9: php/td.php promises PHP >= 8.0 — lint it and run the whole PHP adapter suite on a REAL PHP 8.0
  # (the `test` job uses the runner's newer PHP). setup-php is CI tooling only, not a kit dependency.
  php80:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.0'
          coverage: none
          tools: none
      - run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 0 ? 0 : 1);'
      - run: php -l php/td.php
      # no npm ci: the PHP suite only needs node built-ins. TD_REQUIRE_PHP=1 → fail (never skip) without php.
      - run: node --test "test/php/*.test.js"
        env:
          TD_REQUIRE_PHP: '1'
