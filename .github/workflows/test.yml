# CI for td-components (added v0.13.0, first green on GitHub at v0.16.0). Linux runner: the CSP parity gate skips
# text-metric geometry there (baselines are captured on macOS — see test/csp/csp.spec.mjs BASELINE_PLATFORM).
name: test

on:
  push:
    branches: [main]
  pull_request:
  # Run the whole CI on any pushed branch by hand (offloads the browser gates from the dev Mac, where parallel suites
  # disturb each other): `gh workflow run test.yml --ref <branch>`. No inputs — nothing user-supplied reaches a script.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a running CI (main included — the tag is cut on a green run of the
# exact release commit, so an older main run has no value once a newer one exists).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# v0.62.1: the old single `test` job (~37 min) and `theme` job (~27 min) are split into parallel GitHub-hosted jobs (public
# repo: free, each job its own VM — no cross-suite interference). Wall time ≈ the longest shard (`browser`, ~12 min).
# Local `npm test` still runs everything in one go; the shard scripts live in package.json (test:ci:*).
jobs:
  # check:css / icons / stories, node --test, golden (Chromium)
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: 'chromium'
      - run: npm run test:ci:static

  # web-test-runner, five shards: the root config (Chromium), the `engines` group once per engine (TD_WTR_ENGINES), and
  # every other group (scrollbars, ssr, pointer-n) one after another — `npm run test:browser` locally still runs them all.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: default, engines: chromium }
          - { shard: engines, engines: chromium }
          - { shard: engines, engines: firefox }
          - { shard: engines, engines: webkit }
          - { shard: groups, engines: 'chromium firefox webkit' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: ${{ matrix.engines }}
      - if: matrix.shard != 'groups'
        run: npx web-test-runner --group ${{ matrix.shard }}
        env:
          TD_WTR_ENGINES: ${{ matrix.engines }}
      - if: matrix.shard == 'groups'
        run: npm run test:browser:groups

  # CSP parity gate, td-only and legacy+td profiles (one job each). Linux runner: text-metric geometry is skipped
  # (baselines are captured on macOS — test/csp/csp.spec.mjs BASELINE_PLATFORM).
  csp:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        gate: [test:csp, test:csp:combined]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: 'chromium'
      - run: npm run ${{ matrix.gate }}

  # engine specs (test/engines); tokens + theme switch + touch
  engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gate: [test:engines, test:ci:misc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: 'chromium firefox webkit'
      - run: npm run ${{ matrix.gate }}

  # v0.34.0 responsive gate: Chromium (the most configurations) alone, WebKit + Firefox together. Screenshots (8 acceptance
  # widths) are for humans, never compared.
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, name: chromium }
          - { engine: 'webkit,firefox', name: webkit-firefox }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: ${{ matrix.name == 'chromium' && 'chromium' || 'webkit firefox' }}
      - run: npm run test:responsive
        env:
          RSP_ENGINES: ${{ matrix.engine }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: responsive-screenshots-${{ matrix.name }}
          path: test/responsive/__out__/
          if-no-files-found: ignore

  # v0.41.0 theme contrast gates (token contrast + full-page theme gate), split by engine; the short page-contrast runs
  # of Chromium + Firefox share a job
  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gate: 'test:contrast', engine: chromium, install: chromium }
          - { gate: 'test:contrast', engine: firefox, install: firefox }
          - { gate: 'test:contrast', engine: webkit, install: webkit }
          - { gate: 'test:page-contrast', engine: 'chromium,firefox', install: 'chromium firefox' }
          - { gate: 'test:page-contrast', engine: webkit, install: webkit }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install browsers (5 min per attempt, 3 attempts — the apt mirror sometimes stalls for 20+ min)
        run: scripts/ci-install-browsers.sh
        env:
          ENGINES: ${{ matrix.install }}
      - run: npm run ${{ matrix.gate }}
        env:
          TD_CONTRAST_ENGINES: ${{ matrix.engine }}
          TD_PAGE_ENGINES: ${{ matrix.engine }}

  # v0.33.0: pixel gate for td-media-picker / justified td-media-grid (Chromium; not part of `npm test`). Runs inside the
  # official Playwright image pinned to package.json's playwright-core (fonts + Chromium build = the baselines'
  # reference platform; bump the tag together with playwright-core). TD_VISUAL_STRICT=1: a skip (wrong platform /
  # Chromium build) fails instead of passing silently; a missing baseline always fails. Baselines: workflow
  # update-visual-baselines.yml (same image). Actual PNGs of failing shots are uploaded below.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm run test:visual
        env:
          TD_VISUAL_STRICT: '1'
          TD_VISUAL_OUT: ${{ runner.temp }}/td-visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-actual
          path: ${{ runner.temp }}/td-visual
          if-no-files-found: ignore

  # v0.18.0 F9: php/td.php promises PHP >= 8.0 — lint it and run the whole PHP adapter suite on a REAL PHP 8.0
  # (the `test` job uses the runner's newer PHP). setup-php is CI tooling only, not a kit dependency.
  php80:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.0'
          coverage: none
          tools: none
      - run: |
          php -v
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 0 ? 0 : 1);'
      - run: php -l php/td.php
      # no npm ci: the PHP suite only needs node built-ins. TD_REQUIRE_PHP=1 → fail (never skip) without php.
      - run: node --test "test/php/*.test.js"
        env:
          TD_REQUIRE_PHP: '1'
